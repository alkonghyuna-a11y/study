<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f4f7">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="공부시간">
<title>공부시간 트래커</title>
<style>
  :root{
    --bg:#f4f4f7; --card:#ffffff; --soft:#eff0f4; --line:#e6e6ee;
    --text:#22223a; --muted:#8a8a9a;
    --reading:#8b7dd8; --reading-soft:#ece7f8;
    --other:#5a9fd4; --other-soft:#e2f0fa;
    --grad:linear-gradient(135deg,#8b7dd8 0%,#5a9fd4 100%);
    --danger:#d9607a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;min-height:100dvh;color-scheme:light;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);overflow-x:hidden}
  .num{font-variant-numeric:tabular-nums;font-family:ui-monospace,"SF Mono","Menlo",monospace}

  header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
  header h1{font-size:18px;font-weight:800;letter-spacing:-.01em}
  header h1 span{color:var(--muted);font-weight:600;font-size:15px}
  .gear{background:var(--card);border:1px solid var(--line);color:var(--muted);width:40px;height:40px;border-radius:12px;font-size:17px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}

  nav.tabs{display:flex;gap:4px;padding:2px 14px 10px;overflow-x:auto}
  .tab{background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;padding:8px 15px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .tab.active{color:#fff;background:var(--grad)}

  main{flex:1;overflow-y:auto;padding:0 16px calc(30px + env(safe-area-inset-bottom))}
  .view{display:none}.view.active{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,20,40,.04)}
  .section-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 4px 10px}
  .btn{border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;padding:14px 18px}
  .btn:active{transform:scale(.98)}
  .btn-block{width:100%}
  .btn-grad{background:var(--grad);color:#fff;box-shadow:0 3px 10px rgba(120,100,210,.28)}
  .btn-soft{background:var(--soft);color:var(--text);border:1px solid var(--line)}
  .btn-ghost{background:var(--card);color:var(--danger);border:1px solid var(--line)}
  .muted{color:var(--muted)}.small{font-size:13px}

  /* 타이머 */
  .book-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
  .chip{background:var(--card);border:1.5px solid var(--line);color:var(--text);border-radius:999px;padding:9px 14px;font-size:14px;white-space:nowrap;cursor:pointer;flex:none;display:flex;align-items:center;gap:7px}
  .chip .cdot{width:9px;height:9px;border-radius:50%}
  .chip.sel{border-color:transparent;color:#fff}
  .chip.sel.reading{background:var(--reading)}.chip.sel.other{background:var(--other)}
  .chip.sel .cdot{background:#fff}
  .stopwatch{text-align:center;padding:22px 0 8px}
  .sw-book{font-size:14px;color:var(--muted);min-height:20px;font-weight:600}
  .sw-time{font-size:clamp(46px,15vw,66px);font-weight:700;letter-spacing:.01em;margin:6px 0 4px}
  .sw-state{font-size:13px;color:var(--muted)}
  .sw-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
  .sw-dot.run{background:#4caf6a;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .sw-controls{display:flex;gap:12px;margin-top:14px}

  /* 잔디 */
  .heat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .seg{display:flex;background:var(--soft);border-radius:10px;padding:3px}
  .seg button{background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .heat-scroll{overflow-x:auto;padding-bottom:4px}
  .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;gap:3px;width:max-content}
  .hcell{width:11px;height:11px;border-radius:2px;background:#e9e9ef}
  .heat-legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--muted)}
  .heat-legend .lc{width:11px;height:11px;border-radius:2px}
  .heat-total{font-size:13px;color:var(--muted);margin-top:10px}
  .heat-total b{color:var(--text)}

  /* 막대 */
  .barrow{display:flex;align-items:center;gap:10px;margin:9px 0}
  .barrow .lbl{width:36%;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .barrow .track{flex:1;background:var(--soft);border-radius:7px;height:20px;overflow:hidden}
  .barrow .fill{height:100%;border-radius:7px}
  .barrow .val{font-size:12px;color:var(--muted);width:66px;text-align:right}
  select,input[type=text],input[type=number],input[type=date]{
    background:var(--card);border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font-size:15px;font-family:inherit;width:100%}
  label.f{display:block;font-size:13px;color:var(--muted);margin:12px 2px 6px}

  /* 교재/기록 */
  .item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:9px;box-shadow:0 1px 3px rgba(20,20,40,.04)}
  .item .cdot{width:11px;height:11px;border-radius:50%;flex:none}
  .item .info{flex:1;min-width:0}
  .item .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .item .nm.expanded{white-space:normal;overflow:visible;text-overflow:clip}
  .item .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .item .tags{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
  .tagpill{font-size:11px;background:var(--soft);color:var(--muted);border-radius:6px;padding:2px 7px}
  .acts{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
  .mini{background:var(--soft);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 9px;font-size:12px;cursor:pointer}
  .mini.warn{color:var(--danger)}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:34px 12px;line-height:1.6}

  .log-date{font-size:13px;font-weight:700;margin:16px 4px 8px;display:flex;justify-content:space-between}
  .log-date span{color:var(--muted);font-weight:500}
  .log-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:7px}
  .log-item .cdot{width:9px;height:9px;border-radius:50%;flex:none}
  .log-item .t{flex:1;font-size:14px;min-width:0}
  .log-item .t .b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .log-item .t .m{font-size:12px;color:var(--muted)}
  .log-item .dur{font-size:13px;color:var(--muted)}
  .log-item .del{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px 6px}

  /* 분류 토글 */
  .cat-toggle{display:flex;gap:0;border-radius:12px;overflow:hidden;border:1.5px solid var(--line)}
  .cat-toggle button{flex:1;background:var(--card);border:none;padding:13px;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer}
  .cat-toggle button.on.reading{background:var(--reading-soft);color:var(--reading)}
  .cat-toggle button.on.other{background:var(--other-soft);color:var(--other)}

  /* 시트 */
  .sheet-bg{position:fixed;inset:0;background:rgba(20,20,40,.4);opacity:0;pointer-events:none;transition:.25s;z-index:40}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;
    padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:41;max-width:560px;margin:0 auto;max-height:90dvh;overflow-y:auto}
  .sheet.open{transform:translateY(0)}
  .grip{width:40px;height:4px;background:var(--line);border-radius:2px;margin:8px auto 12px}
  .sheet h2{font-size:17px;font-weight:800;margin:6px 2px 6px}
  .set-item{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:13px 14px;margin-bottom:9px}
  .switch{position:relative;width:50px;height:30px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#d6d6e0;border-radius:999px;transition:.2s;cursor:pointer}
  .slider::before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch input:checked + .slider{background:var(--reading)}
  .switch input:checked + .slider::before{transform:translateX(20px)}
  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:#22223a;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .plan-nav{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
  .pnav{background:var(--card);border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal .dow{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding:2px 0}
  .cal .cell{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:66px;padding:5px 5px 4px;cursor:pointer;overflow:hidden}
  .cal .cell.blank{background:transparent;border:none;cursor:default}
  .cal .cell.today{border-color:var(--other);border-width:2px}
  .cal .cell .dnum{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
  .cal .cell.today .dnum{color:var(--other)}
  .cal .pl{font-size:11px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:1px}
  .pl-done{color:#1f8f52}
  .pl-past{color:#6b6b78}
  .pl-today{color:#2477bf;font-weight:700}
  .pl-future{color:#7157c9}
  .heat-months{position:relative;height:14px;margin-bottom:3px;width:max-content}
  .heat-months span{position:absolute;font-size:10px;color:var(--muted);font-weight:600}
  .cal .more{font-size:9px;color:var(--muted)}
  .goal{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:8px}
  .goal .chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;cursor:pointer;color:transparent}
  .goal .chk.on{background:#3a9d6a;border-color:#3a9d6a;color:#fff}
  .goal .gt{flex:1;min-width:0}
  .goal .gt .gnm{font-weight:600;font-size:15px}
  .goal .gt .gnm.done{color:#3a9d6a;text-decoration:line-through;text-decoration-color:#a9dcc0}
  .goal .gt .gu{font-size:12px;color:var(--muted);margin-top:2px}
  .goal .gact{display:flex;gap:5px;flex:none}
  .unit-toggle{display:flex;gap:6px;flex-wrap:wrap}
  .unit-toggle button{background:var(--soft);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer}
  .unit-toggle button.on{background:var(--reading-soft);color:var(--reading);border-color:transparent}
  .goal-sug{display:none;flex-direction:column;gap:4px;margin-top:6px}
  .sug-item{text-align:left;background:var(--soft);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer;width:100%}
  .sug-item .stag{color:var(--muted);font-size:12px;margin-left:6px}
  .rm-prog{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,20,40,.04)}
  .rm-prog .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .rm-prog .pct{font-weight:800;font-size:18px}
  .rm-prog .rem{font-size:13px;color:var(--muted)}
  .rm-bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
  .rm-bar .fill{height:100%;background:var(--grad);border-radius:6px;transition:width .3s}
  .rm-item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:9px;box-shadow:0 1px 3px rgba(20,20,40,.04)}
  .rm-item .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .rm-item .cdot{width:10px;height:10px;border-radius:50%;flex:none}
  .rm-item .nm{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rm-item .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
  .rm-slots{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .slot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--muted);
    font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
  .slot.on{background:var(--grad);border-color:transparent;color:#fff}
  .rm-target{display:flex;align-items:center;gap:2px;margin-left:auto;background:var(--soft);border-radius:9px}
  .rm-target button{background:none;border:none;color:var(--text);width:30px;height:30px;font-size:16px;cursor:pointer}
  .rm-target .tv{min-width:24px;text-align:center;font-size:13px;font-weight:700}
  .rm-hint{font-size:12px;color:var(--muted);margin:2px 4px 0}
  .rm-move{display:flex;flex-direction:column;gap:2px;flex:none;margin-left:8px}
  .rm-move button{background:var(--soft);border:1px solid var(--line);color:var(--muted);width:30px;height:20px;border-radius:7px;font-size:11px;line-height:1;cursor:pointer;padding:0}
  .rm-move button:disabled{opacity:.35;cursor:default}
  .rm-slots{align-items:flex-start}
  .slotcol{display:flex;flex-direction:column;align-items:center;gap:5px}
  .dt{font-size:11px;white-space:nowrap;cursor:pointer;color:var(--muted)}
  .dt.done{color:#1f8f52;font-weight:700}
  .dt.plan{color:#7157c9}
  .dt.empty{color:#c4c4cc}
</style>
</head>
<body>
  <header>
    <h1>공부시간 <span id="hSub">· 타이머</span></h1>
    <button class="gear" id="gear">⚙</button>
  </header>
  <nav class="tabs">
    <button class="tab active" data-view="timer">타이머</button>
    <button class="tab" data-view="plan">계획</button>
    <button class="tab" data-view="roadmap">로드맵</button>
    <button class="tab" data-view="books">교재</button>
    <button class="tab" data-view="stats">통계</button>
    <button class="tab" data-view="tags">태그</button>
    <button class="tab" data-view="log">기록</button>
  </nav>

  <main>
    <!-- 타이머 -->
    <section id="v-timer" class="view active">
      <div class="section-title">교재 선택</div>
      <input type="text" id="timerSearch" placeholder="교재 이름 검색" style="margin-bottom:8px">
      <div class="book-chips" id="timerTags"></div>
      <div class="book-chips" id="bookChips"></div>
      <div class="book-chips" id="roundChips"></div>
      <div class="card">
        <div class="stopwatch">
          <div class="sw-book" id="swBook">교재를 선택하세요</div>
          <div class="sw-time num" id="swTime">00:00:00</div>
          <div class="sw-state"><span class="sw-dot" id="swDot"></span><span id="swStateT">대기</span></div>
        </div>
        <div class="sw-controls">
          <button class="btn btn-grad btn-block" id="swStart">시작</button>
          <button class="btn btn-ghost" id="swStop" style="display:none">종료·저장</button>
        </div>
      </div>
      <div class="card small"><span class="muted">오늘 순공</span> <b class="num" id="todayTotal">0분</b></div>
    </section>

    <!-- 교재 -->
    <section id="v-books" class="view">
      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>교재 목록</span>
        <button id="toggleArch" class="mini" style="display:none;text-transform:none;letter-spacing:0">보관 보기</button>
      </div>
      <div id="bookList"></div>
      <button class="btn btn-grad btn-block" id="addBook" style="margin-top:6px">＋ 교재 추가</button>
    </section>

    <!-- 통계 -->
    <section id="v-stats" class="view">
      <div class="section-title">연간 순공 밀도</div>
      <div class="card">
        <div class="heat-head">
          <div style="font-weight:700">2026년</div>
          <div class="seg" id="heatSeg">
            <button class="on" data-f="all">전체</button>
            <button data-f="reading">독서</button>
            <button data-f="other">독서외</button>
          </div>
        </div>
        <div class="heat-scroll"><div class="heat-months" id="heatMonMain"></div><div class="heat" id="heatMain"></div></div>
        <div class="heat-legend">적음
          <span class="lc" style="background:#e9e9ef"></span>
          <span class="lc" id="lg1"></span><span class="lc" id="lg2"></span><span class="lc" id="lg3"></span><span class="lc" id="lg4"></span><span class="lc" id="lg5"></span><span class="lc" id="lg6"></span><span class="lc" id="lg7"></span><span class="lc" id="lg8"></span>
          많음</div>
        <div class="heat-total" id="heatTotal">2026년 합계 0분</div>
      </div>
      <div class="section-title">교재별 누적</div>
      <div class="card" id="byBook"></div>
      <div class="section-title">회독 속도 — 얼마나 빨라지는지</div>
      <div class="card">
        <select id="speedBook"></select>
        <div id="speedView" style="margin-top:12px"></div>
      </div>
    </section>

    <!-- 태그 -->
    <section id="v-tags" class="view">
      <div class="section-title">태그 선택</div>
      <div class="book-chips" id="tagChips"></div>
      <div class="card">
        <div class="heat-head"><div style="font-weight:700" id="tagTitle">태그를 선택하세요</div></div>
        <div class="heat-scroll"><div class="heat-months" id="heatMonTag"></div><div class="heat" id="heatTag"></div></div>
        <div class="heat-legend">적음
          <span class="lc" style="background:#e9e9ef"></span>
          <span class="lc" id="tlg1"></span><span class="lc" id="tlg2"></span><span class="lc" id="tlg3"></span><span class="lc" id="tlg4"></span><span class="lc" id="tlg5"></span><span class="lc" id="tlg6"></span><span class="lc" id="tlg7"></span><span class="lc" id="tlg8"></span>
          많음</div>
        <div class="heat-total" id="tagTotal"></div>
      </div>
      <div class="card" id="tagBooks" style="display:none"></div>
    </section>

    <!-- 계획 -->
    <section id="v-plan" class="view">
      <div class="seg" id="planSeg" style="width:100%;margin:2px 0 6px">
        <button class="on" data-m="month" style="flex:1">월간</button>
        <button data-m="day" style="flex:1">일간</button>
      </div>
      <div class="plan-nav">
        <button class="pnav" id="planPrev">‹</button>
        <div id="planTitle" style="font-weight:800;font-size:16px">2026년</div>
        <button class="pnav" id="planNext">›</button>
        <button class="btn-soft" id="planToday" style="border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600">오늘</button>
      </div>
      <div id="planMonth"></div>
      <div id="planDay"></div>
    </section>

    <!-- 로드맵 -->
    <section id="v-roadmap" class="view">
      <div class="section-title">과목(태그) 선택</div>
      <div class="book-chips" id="rmTags"></div>
      <div id="rmProgress"></div>
      <div id="rmList"></div>
    </section>

    <!-- 기록 -->
    <section id="v-log" class="view">
      <div class="section-title">세션 기록</div>
      <button class="btn btn-soft btn-block" id="addSession" style="margin-bottom:6px">＋ 수동으로 시간 추가</button>
      <div id="logList"></div>
    </section>
  </main>

  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet"><div class="grip"></div><div id="sheetBody"></div></div>
  <div class="toast" id="toast"></div>

<script>
"use strict";
/* 라이트 테마 · 서버 없음 · IndexedDB · 오프라인
   분류(독서/독서외) · 회독 카운터(수동) · 태그별 연간 잔디 밀도 */

const PALETTE=['#efeafa','#ddd2f4','#c9b8ee','#b19ee6','#9a83dd','#8168ce','#6a50b8','#232032'];
const EMPTY='#e9e9ef';
const YEAR=new Date().getFullYear();

/* IndexedDB */
const DBN="study2-db",DBV=2; let db=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,DBV);
  r.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains("books")){d.createObjectStore("books",{keyPath:"id",autoIncrement:true});}
    if(!d.objectStoreNames.contains("sessions")){const s=d.createObjectStore("sessions",{keyPath:"id",autoIncrement:true});s.createIndex("bookId","bookId");s.createIndex("dateKey","dateKey");}
    if(!d.objectStoreNames.contains("meta")){d.createObjectStore("meta",{keyPath:"key"});}
    if(!d.objectStoreNames.contains("plans")){const p=d.createObjectStore("plans",{keyPath:"id",autoIncrement:true});p.createIndex("date","date");}};
  r.onsuccess=()=>{db=r.result;res();};r.onerror=()=>rej(r.error);});}
const st=(n,m="readonly")=>db.transaction(n,m).objectStore(n);
const put=(n,v)=>new Promise((res,rej)=>{const r=st(n,"readwrite").put(v);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const del=(n,k)=>new Promise((res,rej)=>{const r=st(n,"readwrite").delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
const getM=(k)=>new Promise((res,rej)=>{const r=st("meta").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const allOf=(n)=>new Promise((res,rej)=>{const r=st(n).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const clearS=(n)=>new Promise((res,rej)=>{const r=st(n,"readwrite").clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});

/* 상태 */
let books=[],sessions=[],selBookId=null,selTag=null,heatFilter='all';
let active=null,swInt=null,cpInt=null,wakeLock=null,wakeOn=false;

/* 유틸 */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const dateKey=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmtClock=ms=>{const t=Math.floor(ms/1000);return pad(Math.floor(t/3600))+":"+pad(Math.floor(t%3600/60))+":"+pad(t%60);};
function fmtDur(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
  if(h>0&&m>0)return h+"시간 "+m+"분";if(h>0)return h+"시간";if(m>0)return m+"분";return sec+"초";}
const fmtH=sec=>(sec/3600).toFixed(1)+"h";
const bookOf=id=>books.find(b=>b.id===id);
const bookName=id=>{const b=bookOf(id);return b?b.name:"(삭제됨)";};
const catColor=c=>c==='other'?'var(--other)':'var(--reading)';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1800);}
function level(sec){if(sec<=0)return 0;const h=sec/3600;if(h>=8)return 8;return Math.min(7,Math.ceil(h));}
function heatColor(sec){const l=level(sec);return l===0?EMPTY:PALETTE[l-1];}
function allTags(){const s=new Set();books.forEach(b=>(b.tags||[]).forEach(t=>s.add(t)));return[...s].sort();}

/* 화면 켜짐 */
async function reqWake(){if(!wakeOn||!("wakeLock"in navigator))return;try{wakeLock=await navigator.wakeLock.request("screen");}catch(e){}}
function relWake(){if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null;}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")checkpoint();
  else if(active&&active.running&&wakeOn)reqWake();});
window.addEventListener("pagehide",checkpoint);

/* 스톱워치 */
const elapsedMs=()=>active?active.accMs+(active.running?Date.now()-active.lastResumeTs:0):0;
async function persistActive(){if(active)await put("meta",{key:"active",value:active});else await del("meta","active");}
function checkpoint(){if(active&&active.running){active.accMs+=Date.now()-active.lastResumeTs;active.lastResumeTs=Date.now();persistActive();}}
async function swStart(){
  if(!active){if(!selBookId){toast("먼저 교재를 선택하세요");return;}
    active={bookId:selBookId,round:selRound,accMs:0,running:true,lastResumeTs:Date.now(),startedAt:new Date().toISOString()};}
  else{active.running=true;active.lastResumeTs=Date.now();}
  await persistActive();reqWake();loops(true);renderSW();}
async function swPause(){checkpoint();active.running=false;await persistActive();loops(false);relWake();renderSW();}
async function swStop(){checkpoint();const sec=Math.round(active.accMs/1000);
  if(sec>=1){
    await put("sessions",{bookId:active.bookId,seconds:sec,startedAt:active.startedAt,endedAt:new Date().toISOString(),round:active.round||1,dateKey:dateKey()});}
  active=null;await persistActive();loops(false);relWake();await reload();renderSW();
  toast(sec>=1?"저장됨 · "+fmtDur(sec):"1초 미만 저장 안 함");}
function loops(on){clearInterval(swInt);clearInterval(cpInt);swInt=cpInt=null;
  if(on){swInt=setInterval(()=>$("swTime").textContent=fmtClock(elapsedMs()),1000);cpInt=setInterval(checkpoint,10000);}}

/* 타이머 렌더 */
let timerTag=null, timerSearch="", showArchived=false, selRound=1;
const nextUndone=b=>Math.min(Math.max(1,b.rmTarget||1),(Math.min(Math.max(1,b.rmTarget||1),Math.max(0,b.rmDone||0)))+1);
function renderRoundChips(){const c=$("roundChips");c.innerHTML="";
  const b=selBookId?bookOf(selBookId):null;
  if(!b){c.style.display="none";return;}
  const t=Math.max(1,b.rmTarget||1);
  if(t<=1){c.style.display="none";return;}   // 회독 개념 없는 교재
  c.style.display="flex";
  const lbl=document.createElement("span");lbl.className="muted small";lbl.style.cssText="align-self:center;margin-right:4px";lbl.textContent="회독";c.appendChild(lbl);
  for(let k=1;k<=t;k++){const el=document.createElement("button");
    el.className="chip"+(k===selRound?" sel reading":"");el.textContent=k+"회독"+(k<=(b.rmDone||0)?" ✓":"");
    el.onclick=()=>{if(active){toast("진행 중에는 회독을 바꿀 수 없습니다");return;}selRound=k;renderRoundChips();renderSW();};
    c.appendChild(el);}}
function renderTimerTags(){const c=$("timerTags");const tags=allTags();
  if(!tags.length){c.style.display="none";c.innerHTML="";return;}
  c.style.display="flex";c.innerHTML="";
  const mk=(label,val)=>{const el=document.createElement("button");
    el.className="chip"+(timerTag===val?" sel reading":"");el.textContent=label;
    el.onclick=()=>{timerTag=val;renderTimerTags();renderChips();};return el;};
  c.appendChild(mk("전체",null));
  tags.forEach(t=>c.appendChild(mk("#"+t,t)));}
function renderChips(){renderTimerTags();const c=$("bookChips");c.innerHTML="";
  const q=timerSearch.trim().toLowerCase();
  const act=books.filter(b=>!b.archived
    && (timerTag?(b.tags||[]).includes(timerTag):true)
    && (q?b.name.toLowerCase().includes(q):true));
  if(!act.length){c.innerHTML='<span class="muted small" style="padding:8px 0">'+(books.filter(b=>!b.archived).length?'조건에 맞는 교재가 없습니다.':'교재 탭에서 교재를 먼저 추가하세요.')+'</span>';renderRoundChips();return;}
  act.forEach(b=>{const el=document.createElement("button");
    el.className="chip"+(b.id===selBookId?" sel "+(b.category||'reading'):"");
    el.innerHTML=`<span class="cdot" style="background:${catColor(b.category)}"></span>${esc(b.name)}`;
    el.onclick=()=>{if(active){toast("진행 중에는 교재를 바꿀 수 없습니다");return;}selBookId=b.id;selRound=nextUndone(b);renderChips();renderRoundChips();renderSW();};
    c.appendChild(el);});
  renderRoundChips();}
function renderSW(){const running=active&&active.running,paused=active&&!active.running;
  const bId=active?active.bookId:selBookId;const rd=active?active.round:selRound;
  const b=bId?bookOf(bId):null;const showR=b&&Math.max(1,b.rmTarget||1)>1;
  $("swBook").textContent=bId?(bookName(bId)+(showR?" · "+rd+"회독":"")):"교재를 선택하세요";
  $("swTime").textContent=fmtClock(elapsedMs());
  $("swDot").className="sw-dot"+(running?" run":"");
  $("swStateT").textContent=running?"측정 중":paused?"일시정지":"대기";
  $("swStart").textContent=running?"일시정지":paused?"이어서":"시작";
  $("swStart").className="btn btn-block "+(running?"btn-soft":"btn-grad");
  $("swStop").style.display=active?"block":"none";}
function refreshTotals(){const t=sessions.filter(s=>s.dateKey===dateKey()).reduce((a,s)=>a+s.seconds,0);
  $("todayTotal").textContent=fmtDur(t);}

/* 교재 렌더 */
function renderBooks(){const w=$("bookList");w.innerHTML="";
  if(!books.length){w.innerHTML='<div class="empty">등록된 교재가 없습니다.<br>아래 버튼으로 첫 교재를 추가하세요.</div>';
    $("toggleArch").style.display="none";return;}
  const archived=books.filter(b=>b.archived);
  const t=$("toggleArch");
  if(archived.length){t.style.display="block";t.textContent=showArchived?("보관 숨기기"):("보관 "+archived.length+"개 보기");
    t.onclick=()=>{showArchived=!showArchived;renderBooks();};}
  else t.style.display="none";
  const list=showArchived?books:books.filter(b=>!b.archived);
  if(!list.length){w.innerHTML='<div class="empty small">표시할 교재가 없습니다. 위 "보관 보기"로 보관 교재를 확인하세요.</div>';return;}
  list.forEach(b=>{const sec=sessions.filter(s=>s.bookId===b.id).reduce((a,s)=>a+s.seconds,0);
    const el=document.createElement("div");el.className="item";
    const tagsHtml=(b.tags||[]).map(t=>`<span class="tagpill">#${esc(t)}</span>`).join("");
    el.innerHTML=`<span class="cdot" style="background:${catColor(b.category)}"></span>
      <div class="info"><div class="nm">${esc(b.name)}${b.archived?' <span class="muted small">(보관)</span>':''}</div>
      <div class="sub">${b.category==='other'?'독서외':'독서'} · 누적 ${fmtDur(sec)}</div>
      <div class="tags">${tagsHtml}</div></div>
      <div class="acts"><button class="mini" data-a="edit">편집</button><button class="mini warn" data-a="del">삭제</button></div>`;
    const nm=el.querySelector('.nm');nm.style.cursor='pointer';nm.onclick=(e)=>e.currentTarget.classList.toggle('expanded');
    el.querySelector('[data-a=edit]').onclick=()=>editBookFlow(b);
    el.querySelector('[data-a=del]').onclick=async()=>{const cnt=sessions.filter(s=>s.bookId===b.id).length;
      if(confirm(`'${b.name}'을(를) 삭제하면 관련 시간 기록 ${cnt}건도 함께 사라져 통계·연간 잔디에서 빠집니다.\n\n목록만 정리하려면 삭제 대신 편집 → 보관을 쓰세요. 보관하면 기록은 통계에 그대로 남습니다.\n\n그래도 삭제할까요?`)){
        for(const s of sessions.filter(s=>s.bookId===b.id))await del("sessions",s.id);
        await del("books",b.id);if(selBookId===b.id)selBookId=null;await reload();toast("삭제됨");}};
    w.appendChild(el);});}
function parseTags(str){return (str||"").split(/[\s,]+/).map(t=>t.replace(/^#/,"").trim()).filter(Boolean);}
function bookForm(b){return `
  <label class="f">교재 이름</label><input type="text" id="fName" value="${b?esc(b.name):''}" placeholder="예: 투운사 기본서 1권">
  <label class="f">분류</label>
  <div class="cat-toggle" id="fCat">
    <button data-c="reading" class="${!b||b.category!=='other'?'on reading':''}">독서</button>
    <button data-c="other" class="${b&&b.category==='other'?'on other':''}">독서외</button>
  </div>
  <label class="f">태그 (공백 구분, # 생략 가능)</label>
  <input type="text" id="fTags" value="${b?(b.tags||[]).join(' '):''}" placeholder="예: 투운사 자격증">`;}
function bindCatToggle(){let cat=$("fCat").querySelector('.on').dataset.c;
  $("fCat").querySelectorAll('button').forEach(btn=>btn.onclick=()=>{cat=btn.dataset.c;
    $("fCat").querySelectorAll('button').forEach(x=>x.className="");btn.className="on "+cat;});
  return ()=>$("fCat").querySelector('.on').dataset.c;}
function addBookFlow(){openSheet(`<h2>교재 추가</h2>${bookForm(null)}
  <button class="btn btn-grad btn-block" id="fSave" style="margin-top:16px">추가</button>`);
  const getCat=bindCatToggle();
  $("fSave").onclick=async()=>{const name=$("fName").value.trim();if(!name){toast("이름을 입력하세요");return;}
    const id=await put("books",{name,category:getCat(),tags:parseTags($("fTags").value),createdAt:new Date().toISOString(),archived:false});
    closeSheet();await reload();if(!selBookId)selBookId=id;renderChips();renderSW();toast("추가됨");};}
function editBookFlow(b){openSheet(`<h2>교재 편집</h2>${bookForm(b)}
  <div class="set-item" style="margin-top:12px"><div>보관 (목록에서 숨김)</div>
    <label class="switch"><input type="checkbox" id="fArch" ${b.archived?'checked':''}><span class="slider"></span></label></div>
  <button class="btn btn-grad btn-block" id="fSave" style="margin-top:8px">저장</button>`);
  const getCat=bindCatToggle();
  $("fSave").onclick=async()=>{b.name=$("fName").value.trim()||b.name;b.category=getCat();b.tags=parseTags($("fTags").value);b.archived=$("fArch").checked;
    await put("books",b);closeSheet();await reload();toast("저장됨");};}

/* 잔디 렌더 */
function renderHeat(el,filterFn,palette){el.innerHTML="";
  const map={};sessions.filter(filterFn).forEach(s=>{map[s.dateKey]=(map[s.dateKey]||0)+s.seconds;});
  const start=new Date(YEAR,0,1),end=new Date(YEAR,11,31);
  for(let i=0;i<start.getDay();i++){const c=document.createElement("div");c.className="hcell";el.appendChild(c);}
  let total=0;
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const k=dateKey(d);const sec=map[k]||0;total+=sec;
    const c=document.createElement("div");c.className="hcell";c.style.background=heatColor(sec);c.title=k+" "+fmtDur(sec);el.appendChild(c);}
  return total;}
function paintLegend(prefix){for(let i=1;i<=8;i++){const e=$(prefix+i);if(e)e.style.background=PALETTE[i-1];}}
function renderMonthLabels(el){el.innerHTML="";
  const start=new Date(YEAR,0,1),startDow=start.getDay(),COL=14; // 셀11+간격3
  const end=new Date(YEAR,11,31);
  const totalDays=Math.round((end-start)/86400000)+1;
  const totalCols=Math.ceil((startDow+totalDays)/7);
  let last=-1;
  for(let col=0;col<totalCols;col++){
    const di=col*7-startDow;                 // 그 열 최상단(일요일)의 날짜 index (0=1/1)
    const d=di<0?start:new Date(YEAR,0,1+di); // 첫 열 상단 빈칸이면 1/1(1월)로 취급
    if(d.getFullYear()!==YEAR)continue;
    const mo=d.getMonth();
    if(mo!==last){last=mo;
      const s=document.createElement("span");s.textContent=(mo+1)+"월";s.style.left=(col*COL)+"px";el.appendChild(s);}
  }}
function renderStats(){
  const fn=s=>{if(heatFilter==='all')return true;const b=bookOf(s.bookId);return b&&(b.category||'reading')===heatFilter;};
  const total=renderHeat($("heatMain"),fn,heatFilter);renderMonthLabels($("heatMonMain"));
  paintLegend('lg');
  $("heatTotal").innerHTML=`${YEAR}년 합계 <b>${fmtDur(total)}</b>`;
  // 교재별
  const bb=$("byBook");bb.innerHTML="";
  const rows=books.map(b=>({b,sec:sessions.filter(s=>s.bookId===b.id).reduce((a,s)=>a+s.seconds,0)})).filter(r=>r.sec>0).sort((a,b)=>b.sec-a.sec);
  if(!rows.length)bb.innerHTML='<div class="empty small">아직 기록이 없습니다.</div>';
  else{const mx=Math.max(...rows.map(r=>r.sec));rows.forEach(r=>{const el=document.createElement("div");el.className="barrow";
    el.innerHTML=`<div class="lbl">${esc(r.b.name)}</div><div class="track"><div class="fill" style="width:${r.sec/mx*100}%;background:${catColor(r.b.category)}"></div></div><div class="val num">${fmtDur(r.sec)}</div>`;
    bb.appendChild(el);});}
  renderSpeedOptions();renderSpeed();}
function renderSpeedOptions(){const sel=$("speedBook");const cur=sel.value;
  sel.innerHTML='<option value="">교재 선택…</option>'+books.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("");
  if(cur)sel.value=cur;}
function renderSpeed(){const v=$("speedView");const bid=parseInt($("speedBook").value,10);
  if(!bid){v.innerHTML='<div class="empty small">교재를 선택하면 회독별 소요 시간을 비교합니다.</div>';return;}
  const b=bookOf(bid);const ss=sessions.filter(s=>s.bookId===bid);
  if(!ss.length){v.innerHTML='<div class="empty small">이 교재의 기록이 없습니다.</div>';return;}
  const byR={};ss.forEach(s=>{const r=s.round||1;byR[r]=(byR[r]||0)+s.seconds;});
  const rounds=Object.keys(byR).map(Number).sort((a,b)=>a-b);const mx=Math.max(...rounds.map(r=>byR[r]));
  let html="";rounds.forEach((r,i)=>{let delta="";
    if(i>0){const p=byR[rounds[i-1]],dd=byR[r]-p,pct=Math.round(dd/p*100);
      delta=` <span class="small" style="color:${dd<0?'#3a9d6a':'var(--danger)'}">${dd<0?'▼':'▲'}${Math.abs(pct)}%</span>`;}
    html+=`<div class="barrow"><div class="lbl">${r}회독${delta}</div><div class="track"><div class="fill" style="width:${byR[r]/mx*100}%;background:${catColor(b.category)}"></div></div><div class="val num">${fmtDur(byR[r])}</div></div>`;});
  html+=`<div class="small muted" style="margin-top:8px">막대가 짧아질수록(▼) 회독이 빨라진 것입니다.</div>`;
  v.innerHTML=html;}

/* 태그 렌더 */
function renderTagChips(){const c=$("tagChips");c.innerHTML="";const tags=allTags();
  if(!tags.length){c.innerHTML='<span class="muted small" style="padding:8px 0">교재에 태그를 달면 여기에서 주제별로 모아 볼 수 있습니다.</span>';return;}
  if(selTag&&!tags.includes(selTag))selTag=null;
  tags.forEach(t=>{const el=document.createElement("button");el.className="chip"+(t===selTag?" sel reading":"");
    el.innerHTML=`#${esc(t)}`;el.onclick=()=>{selTag=t;renderTags();};c.appendChild(el);});}
function renderTags(){renderTagChips();
  if(!selTag){$("tagTitle").textContent="태그를 선택하세요";$("heatTag").innerHTML="";$("tagTotal").textContent="";$("tagBooks").style.display="none";return;}
  const fn=s=>{const b=bookOf(s.bookId);return b&&(b.tags||[]).includes(selTag);};
  const total=renderHeat($("heatTag"),fn,'all');paintLegend('tlg');renderMonthLabels($("heatMonTag"));
  $("tagTitle").textContent="#"+selTag;
  $("tagTotal").innerHTML=`#${esc(selTag)} ${YEAR}년 합계 <b>${fmtDur(total)}</b>`;
  // 포함 교재별
  const tb=$("tagBooks");const bks=books.filter(b=>(b.tags||[]).includes(selTag));
  const rows=bks.map(b=>({b,sec:sessions.filter(s=>s.bookId===b.id).reduce((a,s)=>a+s.seconds,0)})).sort((a,b)=>b.sec-a.sec);
  if(rows.length){tb.style.display="block";const mx=Math.max(1,...rows.map(r=>r.sec));
    tb.innerHTML='<div class="section-title" style="margin-top:0">포함 교재</div>'+rows.map(r=>
      `<div class="barrow"><div class="lbl">${esc(r.b.name)}</div><div class="track"><div class="fill" style="width:${r.sec/mx*100}%;background:${catColor(r.b.category)}"></div></div><div class="val num">${fmtDur(r.sec)}</div></div>`).join("");}
  else tb.style.display="none";}

/* 기록 렌더 */
function renderLog(){const w=$("logList");w.innerHTML="";
  if(!sessions.length){w.innerHTML='<div class="empty">아직 세션 기록이 없습니다.<br>타이머로 측정하거나 수동으로 추가하세요.</div>';return;}
  const byDay={};sessions.forEach(s=>{(byDay[s.dateKey]||=[]).push(s);});
  Object.keys(byDay).sort().reverse().forEach(k=>{const items=byDay[k].sort((a,b)=>(b.endedAt||"").localeCompare(a.endedAt||""));
    const sum=items.reduce((a,s)=>a+s.seconds,0);const head=document.createElement("div");head.className="log-date";
    head.innerHTML=`<div>${k}</div><span class="num">${fmtDur(sum)}</span>`;w.appendChild(head);
    items.forEach(s=>{const b=bookOf(s.bookId);const tm=s.endedAt?new Date(s.endedAt):null;
      const el=document.createElement("div");el.className="log-item";
      el.innerHTML=`<span class="cdot" style="background:${catColor(b&&b.category)}"></span>
        <div class="t"><div class="b">${esc(bookName(s.bookId))}</div>
        <div class="m">${s.round||1}회독${tm?' · '+pad(tm.getHours())+':'+pad(tm.getMinutes()):''}</div></div>
        <div class="dur num">${fmtDur(s.seconds)}</div><button class="del">✕</button>`;
      el.querySelector(".del").onclick=async()=>{if(confirm("이 세션을 삭제할까요?")){await del("sessions",s.id);await reload();}};
      w.appendChild(el);});});}
function addSessionFlow(){if(!books.length){toast("교재를 먼저 추가하세요");switchView("books");return;}
  openSheet(`<h2>수동 시간 추가</h2>
    <label class="f">교재</label><select id="mBook">${books.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("")}</select>
    <label class="f">회독</label><input type="number" id="mRound" min="1" max="99" value="1">
    <label class="f">날짜</label><input type="date" id="mDate" value="${dateKey()}">
    <div style="display:flex;gap:10px"><div style="flex:1"><label class="f">시간(시)</label><input type="number" id="mH" min="0" value="0"></div>
    <div style="flex:1"><label class="f">분</label><input type="number" id="mM" min="0" max="59" value="30"></div></div>
    <button class="btn btn-grad btn-block" id="mSave" style="margin-top:16px">추가</button>`);
  const setDefRound=()=>{const b=bookOf(parseInt($("mBook").value,10));if(b)$("mRound").value=nextUndone(b);};setDefRound();
  $("mBook").onchange=setDefRound;
  $("mSave").onclick=async()=>{const bid=parseInt($("mBook").value,10);
    const rd=Math.max(1,parseInt($("mRound").value,10)||1);
    const sec=(parseInt($("mH").value||0,10)*3600)+(parseInt($("mM").value||0,10)*60);
    if(sec<=0){toast("시간을 입력하세요");return;}const dk=$("mDate").value||dateKey();
    await put("sessions",{bookId:bid,seconds:sec,startedAt:dk+"T00:00:00",endedAt:dk+"T00:00:00",round:rd,dateKey:dk});
    closeSheet();await reload();toast("추가됨 · "+fmtDur(sec));};}

/* 설정/시트 */
const sheet=$("sheet"),sheetBg=$("sheetBg");
function openSheet(html){$("sheetBody").innerHTML=html;sheet.classList.add("open");sheetBg.classList.add("open");}
function closeSheet(){sheet.classList.remove("open");sheetBg.classList.remove("open");}
sheetBg.onclick=closeSheet;
$("gear").onclick=()=>{openSheet(`<h2>설정</h2>
  <div class="set-item"><div><div>화면 켜짐 유지</div><div class="small muted">측정 중 화면이 꺼지지 않게</div></div>
    <label class="switch"><input type="checkbox" id="optWake" ${wakeOn?'checked':''}><span class="slider"></span></label></div>
  <div class="section-title">데이터</div>
  <button class="btn btn-soft btn-block" id="expJson" style="margin-bottom:8px">JSON 백업 내보내기</button>
  <button class="btn btn-soft btn-block" id="expMd" style="margin-bottom:8px">Obsidian 마크다운 내보내기</button>
  <button class="btn btn-soft btn-block" id="impJson" style="margin-bottom:8px">JSON 백업으로 복원</button>
  <input type="file" id="impFile" accept="application/json" style="display:none">
  <button class="btn btn-ghost btn-block" id="wipe">모든 데이터 삭제</button>`);
  $("optWake").onchange=e=>{wakeOn=e.target.checked;put("meta",{key:"wakeOn",value:wakeOn});if(wakeOn&&active&&active.running)reqWake();else if(!wakeOn)relWake();};
  $("expJson").onclick=exportJSON;$("expMd").onclick=exportMD;
  $("impJson").onclick=()=>$("impFile").click();
  $("impFile").onchange=importJSON;
  $("wipe").onclick=async()=>{if(confirm("모든 교재·기록을 삭제할까요? 되돌릴 수 없습니다.")){
    await clearS("sessions");await clearS("books");await del("meta","active");active=null;selBookId=null;selTag=null;await reload();closeSheet();toast("전체 삭제됨");}};};

/* 내보내기/복원 */
function download(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function exportJSON(){download("study-"+dateKey()+".json",JSON.stringify({v:2,books,sessions,plans},null,2),"application/json");}
function exportMD(){const tot=sessions.reduce((a,s)=>a+s.seconds,0);
  let md=`# 공부시간 기록 (${dateKey()})\n\n총 순공: **${fmtDur(tot)}**\n\n## 교재별\n\n`;
  books.forEach(b=>{const sec=sessions.filter(s=>s.bookId===b.id).reduce((a,s)=>a+s.seconds,0);
    md+=`- ${b.name} (${b.category==='other'?'독서외':'독서'}${(b.tags||[]).length?' · '+b.tags.map(t=>'#'+t).join(' '):''}) — ${fmtDur(sec)}\n`;});
  md+=`\n## 세션 로그\n\n| 날짜 | 교재 | 회독 | 시간 |\n|---|---|---|---|\n`;
  sessions.slice().sort((a,b)=>a.dateKey.localeCompare(b.dateKey)).forEach(s=>{md+=`| ${s.dateKey} | ${bookName(s.bookId)} | ${s.round||1} | ${fmtDur(s.seconds)} |\n`;});
  download("study-"+dateKey()+".md",md,"text/markdown");}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.books||!d.sessions)throw 0;
    if(!confirm("현재 데이터를 백업 내용으로 교체합니다. 진행할까요?"))return;
    await clearS("books");await clearS("sessions");await clearS("plans");
    for(const b of d.books)await put("books",b);
    if(d.plans)for(const p of d.plans)await put("plans",p);
    for(const s of d.sessions)await put("sessions",s);
    await reload();closeSheet();toast("복원 완료");}catch(err){toast("올바른 백업 파일이 아닙니다");}};
  r.readAsText(f);}

/* ===== 계획(월/일) — 시간·회독과 완전 분리 ===== */
let plans=[], planMode="month", planYM={y:new Date().getFullYear(),m:new Date().getMonth()}, planDate=new Date();
const DOW=["일","월","화","수","목","금","토"];
/* 로드맵 회독 날짜에서 자동 파생 */
function planItemsOn(k){const items=[];
  books.forEach(b=>{const dates=b.rmDates||{};Object.keys(dates).forEach(kk=>{const d=normD(dates[kk]);if(!d.s)return;
    const inRange=d.e?(d.s<=k&&k<=d.e):(d.s===k);
    if(inRange){const rd=+kk;items.push({title:b.name,round:rd,done:rd<=rmD(b),cat:b.category});}});});
  return items.sort((a,b)=>a.title.localeCompare(b.title)||a.round-b.round);}
function planStatusOf(item,dateK){if(item.done)return "done";const t=dateKey();if(dateK<t)return "past";if(dateK===t)return "today";return "future";}
function renderPlan(){
  document.querySelectorAll("#planSeg button").forEach(b=>b.classList.toggle("on",b.dataset.m===planMode));
  if(planMode==="month"){$("planMonth").style.display="block";$("planDay").style.display="none";renderPlanMonth();}
  else{$("planMonth").style.display="none";$("planDay").style.display="block";renderPlanDay();}
}
function renderPlanMonth(){
  $("planTitle").textContent=planYM.y+"년 "+(planYM.m+1)+"월";
  const first=new Date(planYM.y,planYM.m,1),last=new Date(planYM.y,planYM.m+1,0);
  let html='<div class="cal">'+DOW.map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<first.getDay();i++)html+='<div class="cell blank"></div>';
  const today=dateKey();
  for(let d=1;d<=last.getDate();d++){
    const dt=new Date(planYM.y,planYM.m,d),k=dateKey(dt);
    const items=planItemsOn(k);
    let inner=`<div class="dnum">${d}</div>`;
    items.slice(0,3).forEach(it=>{inner+=`<div class="pl pl-${planStatusOf(it,k)}">${esc(it.title)} ${it.round}회독</div>`;});
    if(items.length>3)inner+=`<div class="more">+${items.length-3}</div>`;
    html+=`<div class="cell${k===today?' today':''}" data-k="${k}">${inner}</div>`;
  }
  html+="</div>";
  $("planMonth").innerHTML=html;
  $("planMonth").querySelectorAll(".cell[data-k]").forEach(c=>c.onclick=()=>{
    const[y,m,dd]=c.dataset.k.split("-").map(Number);planDate=new Date(y,m-1,dd);planMode="day";renderPlan();});
}
function renderPlanDay(){
  const k=dateKey(planDate);
  $("planTitle").textContent=k+" ("+DOW[planDate.getDay()]+")";
  const items=planItemsOn(k);
  let html="";
  if(!items.length)html+='<div class="empty">이 날 계획이 없습니다.<br>로드맵에서 회독 날짜를 넣으면 자동으로 표시됩니다.</div>';
  items.forEach(it=>{const st=planStatusOf(it,k);
    html+=`<div class="goal"><span class="cdot" style="background:${catColor(it.cat)};width:11px;height:11px;border-radius:50%;flex:none"></span>
      <div class="gt"><div class="gnm ${it.done?'done':''}">${esc(it.title)}</div>
      <div class="gu pl-${st}">${it.round}회독 · ${it.done?'완료':(st==='past'?'미완(지남)':st==='today'?'오늘 예정':'예정')}</div></div></div>`;});
  html+='<div class="rm-hint" style="text-align:center;margin-top:10px">완료 체크와 날짜 변경은 로드맵 탭에서 합니다.</div>';
  $("planDay").innerHTML=html;
}
async function reloadPlans(){plans=await allOf("plans");}

/* 계획 네비/세그 */
$("planSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{planMode=b.dataset.m;renderPlan();});
$("planPrev").onclick=()=>{if(planMode==="month"){planYM.m--;if(planYM.m<0){planYM.m=11;planYM.y--;}}else planDate.setDate(planDate.getDate()-1);renderPlan();};
$("planNext").onclick=()=>{if(planMode==="month"){planYM.m++;if(planYM.m>11){planYM.m=0;planYM.y++;}}else planDate.setDate(planDate.getDate()+1);renderPlan();};
$("planToday").onclick=()=>{const n=new Date();if(planMode==="month"){planYM={y:n.getFullYear(),m:n.getMonth()};}else planDate=new Date();renderPlan();};

/* ===== 로드맵(과목별 회독 체크리스트) — 교재 회독 카운터와 독립 ===== */
let selRmTag=null;
const rmT=b=>Math.max(1,b.rmTarget||1);
const rmD=b=>Math.min(rmT(b),Math.max(0,b.rmDone||0));
const normD=v=>!v?{s:"",e:""}:(typeof v==="string"?{s:v,e:""}:{s:v.s||"",e:v.e||""}); // 기존 문자열 날짜 호환
const mdShort=s=>{const p=s.split('-');return (+p[1])+'/'+(+p[2]);};
function renderRmTags(){const c=$("rmTags");c.innerHTML="";const tags=allTags();
  if(!tags.length){c.innerHTML='<span class="muted small" style="padding:8px 0">교재에 태그를 달면 과목별 로드맵이 여기에 나옵니다.</span>';return;}
  if(selRmTag&&!tags.includes(selRmTag))selRmTag=null;
  tags.forEach(t=>{const el=document.createElement("button");el.className="chip"+(t===selRmTag?" sel reading":"");
    el.textContent="#"+t;el.onclick=()=>{selRmTag=t;renderRoadmap();};c.appendChild(el);});}
function renderRoadmap(){renderRmTags();
  const prog=$("rmProgress"),list=$("rmList");
  if(!selRmTag){prog.innerHTML="";list.innerHTML='<div class="empty">과목(태그)을 선택하면 교재별 회독 진도를 한눈에 봅니다.</div>';return;}
  const bks=books.filter(b=>!b.archived&&(b.tags||[]).includes(selRmTag)).sort((a,b)=>((a.order??a.id)-(b.order??b.id)));
  if(!bks.length){prog.innerHTML="";list.innerHTML='<div class="empty small">이 태그의 교재가 없습니다.</div>';return;}
  const done=bks.reduce((a,b)=>a+rmD(b),0),tot=bks.reduce((a,b)=>a+rmT(b),0);
  const pct=tot?Math.round(done/tot*100):0;
  prog.innerHTML=`<div class="rm-prog"><div class="top"><div class="pct">${pct}%</div><div class="rem">${done}/${tot}회독 · 남은 ${tot-done}</div></div>
    <div class="rm-bar"><div class="fill" style="width:${pct}%"></div></div></div>`;
  list.innerHTML="";
  bks.forEach((b,i)=>{const d=rmD(b),t=rmT(b);
    let slots="";for(let k=1;k<=t;k++){
      const dd=normD((b.rmDates||{})[k]);const isDone=k<=d;let dtxt,dcls;
      if(dd.s){const range=dd.e&&dd.e!==dd.s?mdShort(dd.s)+"~"+mdShort(dd.e):mdShort(dd.s);
        if(isDone){dtxt=range;dcls='done';}else{dtxt='예정 '+range;dcls='plan';}}
      else{dtxt='＋ 날짜';dcls='empty';}
      slots+=`<div class="slotcol"><div class="slot ${isDone?'on':''}" data-id="${b.id}" data-k="${k}">${k}</div>
        <div class="dt ${dcls}" data-date="${b.id}" data-dk="${k}">${dtxt}</div></div>`;}
    const el=document.createElement("div");el.className="rm-item";
    el.innerHTML=`<div class="head"><span class="cdot" style="background:${catColor(b.category)}"></span>
      <span class="nm">${esc(b.name)}</span><span class="cnt">${d}/${t}</span>
      <span class="rm-move"><button data-up="${b.id}" ${i===0?'disabled':''}>▲</button><button data-down="${b.id}" ${i===bks.length-1?'disabled':''}>▼</button></span></div>
      <div class="rm-slots">${slots}
        <span class="rm-target"><button data-dec="${b.id}">−</button><span class="tv">${t}</span><button data-inc="${b.id}">＋</button></span>
      </div>`;
    list.appendChild(el);});
  async function moveRm(id,dir){const idx=bks.findIndex(x=>x.id===id);const j=idx+dir;if(j<0||j>=bks.length)return;
    const a=bks[idx],b=bks[j];const ao=a.order??a.id,bo=b.order??b.id;a.order=bo;b.order=ao;
    await put("books",a);await put("books",b);await reload();renderRoadmap();}
  list.querySelectorAll("[data-up]").forEach(btn=>btn.onclick=()=>moveRm(parseInt(btn.dataset.up,10),-1));
  list.querySelectorAll("[data-down]").forEach(btn=>btn.onclick=()=>moveRm(parseInt(btn.dataset.down,10),1));
  list.querySelectorAll(".slot").forEach(s=>s.onclick=async()=>{
    const b=bookOf(parseInt(s.dataset.id,10));if(!b)return;const k=parseInt(s.dataset.k,10);
    b.rmDone=(k===rmD(b))?k-1:k;await put("books",b);await reload();renderRoadmap();});
  list.querySelectorAll("[data-inc]").forEach(btn=>btn.onclick=async()=>{
    const b=bookOf(parseInt(btn.dataset.inc,10));b.rmTarget=Math.min(20,rmT(b)+1);await put("books",b);await reload();renderRoadmap();});
  list.querySelectorAll("[data-dec]").forEach(btn=>btn.onclick=async()=>{
    const b=bookOf(parseInt(btn.dataset.dec,10));b.rmTarget=Math.max(1,rmT(b)-1);b.rmDone=Math.min(b.rmTarget,rmD(b));await put("books",b);await reload();renderRoadmap();});
  list.querySelectorAll(".dt[data-date]").forEach(el=>el.onclick=()=>{
    const b=bookOf(parseInt(el.dataset.date,10));const k=parseInt(el.dataset.dk,10);const cur=normD((b.rmDates||{})[k]);
    openSheet(`<h2>${k}회독 기간</h2><div class="small muted" style="margin:0 2px 10px">며칠에 걸치면 종료일까지, 하루면 종료일을 비워 두세요.</div>
      <label class="f">시작일</label><input type="date" id="rdS" value="${cur.s}">
      <label class="f">종료일 (하루면 비움)</label><input type="date" id="rdE" value="${cur.e}">
      <button class="btn btn-grad btn-block" id="rdSave" style="margin-top:14px">저장</button>
      <button class="btn btn-soft btn-block" id="rdClear" style="margin-top:8px">비우기</button>`);
    $("rdSave").onclick=async()=>{const s=$("rdS").value,e=$("rdE").value;b.rmDates=Object.assign({},b.rmDates||{});
      if(s)b.rmDates[k]={s,e:(e&&e>=s?e:"")};else delete b.rmDates[k];
      await put("books",b);closeSheet();await reload();renderRoadmap();};
    $("rdClear").onclick=async()=>{b.rmDates=Object.assign({},b.rmDates||{});delete b.rmDates[k];await put("books",b);closeSheet();await reload();renderRoadmap();};});
}

/* 네비 */
function switchView(v){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.view===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.remove("active"));$("v-"+v).classList.add("active");
  const sub={timer:'타이머',plan:'계획',roadmap:'로드맵',books:'교재',stats:'통계',tags:'태그',log:'기록'}[v];$("hSub").textContent="· "+sub;
  if(v==="stats")renderStats();if(v==="tags")renderTags();if(v==="log")renderLog();if(v==="books")renderBooks();if(v==="plan")renderPlan();if(v==="roadmap")renderRoadmap();if(v==="timer"){renderChips();renderSW();}}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>switchView(t.dataset.view));
$("heatSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{heatFilter=b.dataset.f;
  $("heatSeg").querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");renderStats();});
$("swStart").onclick=()=>{if(active&&active.running)swPause();else swStart();};
$("swStop").onclick=swStop;
$("addBook").onclick=addBookFlow;$("addSession").onclick=addSessionFlow;$("speedBook").onchange=renderSpeed;
$("timerSearch").oninput=e=>{timerSearch=e.target.value;renderChips();};

async function reload(){books=await allOf("books");sessions=await allOf("sessions");plans=await allOf("plans");
  renderChips();renderSW();refreshTotals();
  const cur=document.querySelector(".view.active").id.replace("v-","");
  if(cur==="books")renderBooks();if(cur==="stats")renderStats();if(cur==="tags")renderTags();if(cur==="log")renderLog();if(cur==="plan")renderPlan();if(cur==="roadmap")renderRoadmap();}

(async function init(){await openDB();
  const w=await getM("wakeOn");wakeOn=w?!!w.value:false;
  const a=await getM("active");if(a&&a.value){active=a.value;active.running=false;active.lastResumeTs=null;selBookId=active.bookId;selRound=active.round||1;await persistActive();}
  await reload();renderSW();
  if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script>
</body>
